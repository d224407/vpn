name: CI

on:
  pull_request:
    branches: [ master, beta, development, test ]
  push:
    branches: [ master, beta, development, test ]

permissions:
  contents: read

# Cancel superseded runs of the same branch/PR (replaces styfle/cancel-workflow-action, which needs actions: write)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    runs-on: windows-latest

    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: setup-msbuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build
        shell: cmd
        run: |
          cd ui\References\Windows
          build.bat

      - name: 🛠 Build portable daemon (IVPN Service.exe)
        shell: pwsh
        working-directory: daemon
        run: |
          $ver = (Get-Content ../ui/package.json -Raw | ConvertFrom-Json).version
          $date = Get-Date -Format "yyyy-MM-dd"
          $ldflags = "-s -w -X github.com/ivpn/desktop-app/daemon/version._version=$ver -X github.com/ivpn/desktop-app/daemon/version._commit=${{ github.sha }} -X github.com/ivpn/desktop-app/daemon/version._time=$date"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "1"
          go build -tags release -o "IVPN Service.exe" -trimpath -ldflags $ldflags
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cgo build failed - retrying without Wi-Fi support (nowifi)"
            $env:CGO_ENABLED = "0"
            go build -tags "release nowifi" -o "IVPN Service.exe" -trimpath -ldflags $ldflags
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: 📁 Assemble portable bundle (UI + daemon)
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/win-unpacked/IVPN.exe")) { Write-Warning "UI executable not found in ui/dist/win-unpacked" }
          $dst = "ui/dist/win-unpacked/daemon"
          New-Item -ItemType Directory -Force "$dst/etc" | Out-Null
          Copy-Item "daemon/IVPN Service.exe" $dst
          Copy-Item "daemon/References/common/etc/*" "$dst/etc"
          # marker file: tells the daemon/UI to work in portable mode (no installer/registry)
          New-Item -ItemType File -Force "$dst/portable" | Out-Null

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivpn-windows-${{ github.sha }}
          path: |
            ui/References/Windows/bin/*.exe
            ui/dist/win-unpacked
          if-no-files-found: warn
          retention-days: 7

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: sudo apt-get install rpm libiw-dev

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 2.7
          bundler-cache: false

      - name: Install fpm
        run: |
          gem install dotenv -v 2.8.1
          gem install fpm

      - name: Build CLI
        run: |
          cd cli/References/Linux
          ./build.sh -v $(cat ../../../ui/package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g')

      - name: Build UI
        run: |
          cd ui/References/Linux
          ./build.sh -v $(cat ../../package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g')

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivpn-linux-${{ github.sha }}
          path: |
            cli/References/Linux/_out_bin/**/*.deb
            cli/References/Linux/_out_bin/**/*.rpm
            ui/References/Linux/_out_bin/**/*.deb
            ui/References/Linux/_out_bin/**/*.rpm
          if-no-files-found: warn
          retention-days: 7

  macos:
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: brew install autoconf automake libtool

      - name: Build
        run: |
          cd ui/References/macOS
          ./build.sh -v $(cat ../../package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g') -c ${{ env.APPLE_DEVID_CERTIFICATE }}
        env:
          APPLE_DEVID_CERTIFICATE: ${{ secrets.APPLE_DEVID_CERTIFICATE || 'DUMMY' }}

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivpn-macos-${{ github.sha }}
          path: |
            ui/References/macOS/_compiled/*.dmg
            cli/References/macOS/_out_bin/**
          if-no-files-found: warn
          retention-days: 7